services:
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: ["minio-data:/data"]
  create-buckets:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on: [minio]
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/lake"
  lake-jobs:
    build: .
    depends_on: [create-buckets]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      LAKE_BUCKET: lake
  trino:
    image: trinodb/trino:455
    ports: ["8081:8080"]
    volumes:
      - ./infra/trino:/etc/trino/catalog:ro
volumes:
  minio-data:
